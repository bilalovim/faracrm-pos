<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="posGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00b89b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#007868;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Иконка терминала/карты -->
  <rect x="5" y="10" width="42" height="40" rx="4" fill="url(#posGradient)" stroke="#005c50" stroke-width="2"/>
  <rect x="10" y="15" width="32" height="20" rx="2" fill="#ffffff" opacity="0.9"/>
  <line x1="13" y1="20" x2="39" y2="20" stroke="#00b89b" stroke-width="1.5"/>
  <line x1="13" y1="25" x2="35" y2="25" stroke="#00b89b" stroke-width="1.5"/>
  <line x1="13" y1="30" x2="37" y2="30" stroke="#00b89b" stroke-width="1.5"/>
  <circle cx="26" cy="42" r="3" fill="#ffffff"/>
  
  <!-- Текст POS -->
  <text x="58" y="42" font-family="Arial, sans-serif" font-weight="900" font-size="32" fill="url(#posGradient)" letter-spacing="1">POS</text>
  
  <!-- Разделитель -->
  <text x="115" y="42" font-family="Arial, sans-serif" font-weight="300" font-size="28" fill="#007868">-</text>
  
  <!-- Текст ATM -->
  <text x="128" y="42" font-family="Arial, sans-serif" font-weight="900" font-size="32" fill="url(#posGradient)" letter-spacing="1">ATM</text>
</svg>
