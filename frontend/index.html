<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- POS-ATM logo -->
    <link rel="icon" type="image/svg+xml" href="/logo-mark.svg" />
    <!-- для поддержки остальных. 32 x 32 пикселя -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <!-- для создание иконки на смартфонах и планшетах. 512 x 512 пикселей -->
    <link rel="apple-touch-icon" href="/icon-512.png" />
    <!-- PWA-манифест отдаёт бэк (а не статика), чтобы админ мог менять
         его в админке без передеплоя. После загрузки JS BrandingHead.tsx
         клеит сюда ?v=<manifest_version> для cache-bust. -->
    <link rel="manifest" href="/api/public/manifest.json" />

    <meta name="theme-color" content="#228be6" />
    <meta property="og:title" content="POS-ATM" />
    <meta property="og:url" content="https://faracrm.com/" />
    <!-- TODO: создать картинку для социальных сетей -->
    <meta property="og:image" content="/og.jpg" />
    <meta property="twitter:card" content="/og.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta name="description" content="POS-ATM CRM system. Payment and terminal management." />
    <title>POS-ATM</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
